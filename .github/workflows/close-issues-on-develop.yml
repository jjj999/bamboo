name: Close Issues on Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      # The push event runs only after reviewed code reaches develop. Never
      # check out or execute the pull request head.
      - name: Check out develop push
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Close marked Issues
        uses: actions/github-script@v9
        with:
          script: |
            const { closeMarkedIssues } = require(
              "./.github/scripts/close-issues-on-develop"
            );
            await closeMarkedIssues({ github, context, core });
