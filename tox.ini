[tox]
env_list = py311,py312,py313,py314,py315

[testenv]
description = Run the normal pytest suite on {base_python}
deps =
    pytest>=9.1.1,<10
    pytest-cov>=7.1,<8
    peewee>=4.5.3,<5
    uvicorn>=0.54,<0.55
    websocket-client>=1.9,<2
commands =
    python -m pytest -o addopts= --strict-markers -m "not slow"
